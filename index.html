<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group To Do List</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <h1>To Do List</h1>
    </header>

    <main>
      <section class="input-section">
        <form id="todo-form" class="form">
          <div class="input-group">
            <label for="todo-input">New to do</label>

            <input
              type="text"
              id="todo-input"
              placeholder="Enter a new to do..."
              autocomplete="off"
              aria-describedby="error-message"
              required
            />

            <button type="submit" class="add-button">Add To Do</button>
          </div>

          <div
            id="error-message"
            class="error"
            role="alert"
            aria-live="assertive"
          ></div>
        </form>
      </section>

      <section class="controls" aria-label="To do list controls">
        <p id="todo-count" aria-live="polite">0 of 0 items remaining</p>

        <div class="filters" role="group" aria-label="Filter to do list">
          <button
            type="button"
            class="filter-button active"
            data-filter="all"
            aria-pressed="true"
          >
            All
          </button>

          <button
            type="button"
            class="filter-button"
            data-filter="active"
            aria-pressed="false"
          >
            Active
          </button>

          <button
            type="button"
            class="filter-button"
            data-filter="completed"
            aria-pressed="false"
          >
            Completed
          </button>
        </div>
      </section>

      <section class="list-section" aria-label="To do list items">
        <ul id="todo-list" class="list"></ul>
      </section>

      <footer>
        <button id="clear-completed" class="clear-button" type="button">
          Clear Completed
        </button>
      </footer>
    </main>
  </body>
</html>
